# ruff.toml — Standalone ruff configuration for pre-commit hook
# Mirrors the [tool.ruff] section in pyproject.toml

target-version = "py312"
line-length = 100

[lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort (import sorting)
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "RUF001",  # ambiguous fullwidth chars in Chinese strings (intentional)
    "RUF002",  # ambiguous fullwidth chars in Chinese docstrings (intentional)
    "RUF003",  # ambiguous fullwidth chars in Chinese comments (intentional)
]

[lint.per-file-ignores]
# Test files use pytest fixtures from conftest.py — ruff doesn't recognize them
"tests/*.py" = ["F821"]
# test_renderer.py does sys.path manipulation before imports
"tests/test_renderer.py" = ["E402"]

[format]
quote-style = "double"
skip-magic-trailing-comma = false
