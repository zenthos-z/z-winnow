[tool.poetry]
name = "z-winnow"
version = "0.1.0"
description = "winnow information denoising/compression platform"
authors = ["winnow team"]
readme = "README.md"
packages = [{ include = "z_winnow", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.12,<3.14"
# Core orchestration: StateGraph + Send API fan-out for parallel agent execution
langgraph = ">=0.6.0"
# Orchestrator agent loop: deepagents framework provides the reasoning loop
deepagents = ">=0.2.0"
# Unified chat model init + BaseTool + structured output support
langchain = ">=0.3.0"
# OpenAI / DeepSeek models (daily-reporter, engineering-analyzer)
langchain-openai = ">=0.3.0"
# Anthropic Claude models (resource-extractor, output-composer)
langchain-anthropic = ">=0.3.0"
# All subagent I/O schemas (TypedDict, dataclass, validation)
pydantic = ">=2.0"
# Settings management with env-var auto-loading
pydantic-settings = ">=2.0"
# Async SQLite for 3-layer storage with serverID provenance
aiosqlite = ">=0.20.0"
# WeFlow ChatLab HTTP API client (winnow data source)
httpx = ">=0.28.0"
# Load .env for ANTHROPIC_API_KEY, OPENAI_API_KEY, WEFLOW_API_KEY etc.
python-dotenv = ">=1.0"
# Structured logging for LangSmith trace correlation
structlog = ">=24.0"
# LangSmith SDK for observability (tracing, evaluation, feedback)
langsmith = ">=0.2.0"
# Web dashboard: FastAPI + uvicorn server + Jinja2 HTML templates
fastapi = ">=0.115.0"
python-multipart = ">=0.0.18"
uvicorn = ">=0.30.0"
jinja2 = ">=3.1.0"
# OpenAI tokenizer for token counting in unified_reporter
tiktoken = ">=0.9.0"
# GIF frame extraction for multi-frame vision analysis (image_analyzer)
pillow = ">=11.0"
fastmcp = ">=3.2"
boto3 = ">=1.34"
# Daily-report scheduler: cron expression match + next-fire (T-SCHED)
croniter = ">=2.0.0"
# Terminal rendering for scheduler CLI dashboard + wizard (T-SCHED)
rich = ">=13.6.0"

[tool.poetry.group.dev.dependencies]
# Fast all-in-one linter + auto-fixer (replaces flake8, isort, black)
ruff = ">=0.11.0"
# Static type checking (basic mode initially, strict later)
mypy = ">=1.0"
# Security linter for common Python vulnerabilities
bandit = ">=1.7"
# Test runner
pytest = ">=8.0"
# Async test support (aiosqlite, httpx)
pytest-asyncio = ">=0.24.0"
# JSON Schema validation for report schema tests
jsonschema = ">=4.20"
pytest-cov = "^7.1.0"
# Git pre-commit hook framework (run ruff, mypy before commit)
pre-commit = ">=3.8.0"

[tool.poetry.scripts]
winnow = "z_winnow.cli:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

# --- Ruff configuration ---
[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["plans/"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort (import sorting)
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RUF", # ruff-specific rules
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "RUF001",  # ambiguous fullwidth chars in Chinese strings (intentional)
    "RUF002",  # ambiguous fullwidth chars in Chinese docstrings (intentional)
    "RUF003",  # ambiguous fullwidth chars in Chinese comments (intentional)
]

[tool.ruff.format]
quote-style = "double"
skip-magic-trailing-comma = false

[tool.ruff.lint.per-file-ignores]
# Test files use pytest fixtures from conftest.py — ruff doesn't recognize them
"tests/*.py" = ["F821"]
# test_renderer.py does sys.path manipulation before imports
"tests/test_renderer.py" = ["E402"]

# --- MyPy configuration ---
[tool.mypy]
# Basic mode — not strict. Will progressively enable:
#   strict = true (future)
#   disallow_untyped_defs = true (future)
#   check_untyped_defs = true (future)
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
# Only check src/ directory (exclude tests for now)
files = "src/"
# Ignore missing imports for packages without type stubs
ignore_missing_imports = true

# --- Pytest configuration ---
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
# CI runs mock-only tests (no API keys required)
addopts = "-v --tb=short --strict-markers --no-header"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "e2e: marks end-to-end tests requiring external services",
]

# --- Coverage configuration ---
[tool.coverage.run]
source = ["src/z_winnow"]
omit = [
    "*/tests/*",
    "*/templates/*",
    "*/schemas/*",
    "*/__init__.py",
]

[tool.coverage.report]
# fail_under = 70  # Disabled for baseline measurement (T-N2-2), re-enable in T-N2-5
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

# --- Bandit configuration ---
[tool.bandit]
exclude_dirs = ["tests", ".venv", ".claude"]
skips = ["B101"]  # assert used (ok in tests)
