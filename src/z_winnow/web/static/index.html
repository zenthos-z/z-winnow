/* scope: 'all' | 'failed' | 'single'(targets 额外传入) */
function startGen(scope, targets){
  // 单群重新生成 / 重试 → 打开批量面板
  BATCH_PANEL.open();
}

function fireBatch(targets, scope){
  var rowsEl=document.getElementById('gen-rows'), textEl=document.getElementById('gen-text'), fillEl=document.getElementById('gen-fill');
  if(!rowsEl) return;
  rowsEl.innerHTML='';
  genRuns = {}; genSettled = 0;
  genPending = targets.length;
  var today = todayStr();
  /* 占位行 + gid→row 映射（避免对 group_id 做 CSS 转义查询）*/
  var rowByGid = {};
  targets.forEach(function(g){
    var li=document.createElement('li'); li.className='gen-row'; li.dataset.gid=g.group_id;
    li.innerHTML='<span class="gen-name">'+esc(g.display_name)+'</span><span class="gen-mini"><span class="gen-mini-fill" style="width:0%"></span></span><span class="gen-stext">提交中</span>';
    rowsEl.appendChild(li);
    rowByGid[g.group_id] = li;
  });
  if(textEl) textEl.textContent='正在提交 · 0/'+genPending;
  if(fillEl) fillEl.style.width='0%';
  /* 逐群 POST /runs（真正跑 pipeline）*/
  var firedCount = 0, submitFail = 0;
  targets.forEach(function(g){
    api('/runs', {method:'POST', body: JSON.stringify({component:'daily', group_id:g.group_id, date:today})}).then(function(res){
      var rid = res && res.status_url ? String(res.status_url).split('/').pop() : '';
      var rowEl = rowByGid[g.group_id];
      if(rid && rowEl){
        genRuns[rid] = {gid:g.group_id, name:g.display_name, rowEl:rowEl, fillEl:rowEl.querySelector('.gen-mini-fill'), textEl:rowEl.querySelector('.gen-stext'), settled:false};
        if(genRuns[rid].textEl) genRuns[rid].textEl.textContent='等待中';
        firedCount++;
      } else { submitFail++; markRowFailed(g.group_id, rowEl); }
      maybeStartWatch(firedCount, submitFail, textEl);
    }).catch(function(){ submitFail++; markRowFailed(g.group_id, rowByGid[g.group_id]); maybeStartWatch(firedCount, submitFail, textEl); });
  });
}

function markRowFailed(gid, rowEl){
  if(rowEl){
    rowEl.classList.add('is-bad');
    var f=rowEl.querySelector('.gen-mini-fill'), t=rowEl.querySelector('.gen-stext');
    if(f) f.style.width='100%'; if(t) t.textContent='提交失败';
  }
  if(gid) GEN_STATUS[gid]='bad';
  genSettled++;
}
function maybeStartWatch(firedCount, submitFail, textEl){
  /* 全部提交请求返回后（成功+失败）开始订阅 SSE */
  if(firedCount + submitFail < genPending) return;
  if(firedCount===0){ finalizeGen(textEl); return; }
  if(textEl) textEl.textContent='正在生成 · 0/'+firedCount;
  watchGenRuns(firedCount);
}

function watchGenRuns(expect){
  if(genTimer) clearTimeout(genTimer);
  /* 5 分钟兜底 */
  genTimer = setTimeout(function(){ finalizeGen(document.getElementById('gen-text')); }, 300000);
  try{ genEs = new EventSource('/api/v1/runs/stream'); }
  catch(e){ finalizeGen(document.getElementById('gen-text')); return; }
  genEs.onmessage = function(ev){
    var data; try{ data=JSON.parse(ev.data); }catch(e){ return; }
    var runs = (data&&data.runs)||[];
    for(var i=0;i<runs.length;i++){
      var run = runs[i], rid = run.run_id;
      if(!(rid in genRuns)) continue;
      var entry = genRuns[rid];
      if(entry.settled) continue;
      updateGenRow(entry, run);
      if(isTerminalRun(run.status)){
        entry.settled = true;
        GEN_STATUS[entry.gid] = TERMINAL_OK[run.status] ? 'ok' : 'bad';
        genSettled++;
        var t=document.getElementById('gen-text');
        if(t) t.textContent='正在生成 · '+genSettled+'/'+expect;
        var f=document.getElementById('gen-fill');
        if(f) f.style.width=(genSettled/expect*100)+'%';
        if(genSettled>=expect){ finalizeGen(document.getElementById('gen-text')); break; }
      }
    }
  };
  genEs.onerror = function(){ /* 瞬断忽略，靠 timer 兜底 */ };
}
function updateGenRow(entry, run){
  var pct = run.progress_pct!=null ? run.progress_pct : 0;
  if(TERMINAL_OK[run.status]){
    entry.rowEl.classList.add('is-ok'); entry.rowEl.classList.remove('is-bad');
    if(entry.fillEl) entry.fillEl.style.width='100%';
    if(entry.textEl) entry.textEl.textContent='成功';
  } else if(TERMINAL_BAD[run.status]){
    entry.rowEl.classList.add('is-bad'); entry.rowEl.classList.remove('is-ok');
    if(entry.fillEl) entry.fillEl.style.width='100%';
    if(entry.textEl) entry.textEl.textContent='失败';
  } else {
    /* running / queued */
    if(entry.fillEl) entry.fillEl.style.width = Math.max(3, pct) + '%';
    if(entry.textEl){
      if(run.status==='queued'||!run.status){ entry.textEl.textContent='等待中'; }
      else { entry.textEl.textContent='生成中 '+(pct||0)+'%'; }
    }
  }
}
function finalizeGen(textEl){
  if(genEs){ try{ genEs.close(); }catch(e){} genEs=null; }
  if(genTimer){ clearTimeout(genTimer); genTimer=null; }
  var ok=0, bad=0;
  for(var k in genRuns){ if(GEN_STATUS[genRuns[k].gid]==='ok') ok++; else if(GEN_STATUS[genRuns[k].gid]==='bad') bad++; }
  var pending = genPending - ok - bad;
  if(textEl) textEl.textContent='完成 · '+ok+' 成功 / '+bad+' 失败'+(pending?' · 进行中 '+pending:'');
  var fillEl=document.getElementById('gen-fill'); if(fillEl) fillEl.style.width='100%';
  var btn=document.getElementById('btn-gen-all'), detail=document.getElementById('gen-detail'), doneEl=document.getElementById('gen-done');
  var failBtn = doneEl ? doneEl.querySelector('[data-scope="failed"]') : null;
  setTimeout(function(){
    if(btn){ btn.classList.remove('is-gen'); btn.classList.remove('is-open'); btn.hidden=true; }
    if(detail) detail.hidden=true;
    if(doneEl){ doneEl.hidden=false; if(failBtn){ if(bad>0){ failBtn.hidden=false; failBtn.textContent='重新生成失败的 ('+bad+')'; } else { failBtn.hidden=true; } } }
  }, 1200);
  /* 重拉 overview 刷新表格 + 卡片 */
  refreshOverview();
}

function selectPicker(s){
  var f=document.getElementById('newgrp-form');
  f.elements['chatroom_id'].value=s.chatroom_id; f.elements['display_name'].value=s.display_name;
  togglePicker(false); toast('已选择「'+s.display_name+'」');
  var search=document.getElementById('ng-picker-search'); if(search) search.value='';
}
function filterPicker(q){
  q=(q||'').trim().toLowerCase(); if(!q){ renderPickerList(NG_SESSIONS); return; }
  renderPickerList(NG_SESSIONS.filter(function(s){ return (s.display_name||'').toLowerCase().indexOf(q)>=0 || (s.chatroom_id||'').toLowerCase().indexOf(q)>=0; }));
}

async function submitNewGroup(e){
  e.preventDefault();
  var form=e.target, err=document.getElementById('ng-error'); err.textContent='';
  var cidEl=form.elements['chatroom_id'], nameEl=form.elements['display_name'];
  var cid=(cidEl.value||'').trim(), name=(nameEl.value||'').trim();
  if(!cid||!name){ err.textContent='请填写 chatroom ID 与显示名称'; (!cid?cidEl:nameEl).focus(); return false; }
  if(!/^[0-9A-Za-z_\-]+@chatroom$/.test(cid)){ err.textContent='chatroom ID 格式应为 xxx@chatroom'; cidEl.focus(); return false; }
  var body = {
    chatroom_id:cid, display_name:name,
    output_dir:(form.elements['output_dir'].value||'').trim()||null,
    daily_report_enabled:form.elements['daily_report_enabled'].checked,
    daily_schedule_cron:(form.elements['daily_schedule_cron'].value||'').trim()||null,
    is_active:form.elements['is_active'].checked,
    feishu_enabled:form.elements['feishu_enabled'].checked,
    custom_prompt_hints:(form.elements['custom_prompt_hints'].value||'').trim()||null
  };
  var submitBtn=document.getElementById('ng-submit'); if(submitBtn) submitBtn.disabled=true;
  try{
    await api('/groups', {method:'POST', body:JSON.stringify(body)});
    form.reset(); syncNgSched(); confirmDirPickerReset();
    toggleNewGroup(false);
    toast('已创建「'+name+'」· 正在刷新列表');
    await refreshOverview();
  }catch(ex){ err.textContent='创建失败：'+(ex&&ex.message||ex); }
  finally{ if(submitBtn) submitBtn.disabled=false; }
  return false;
}
function confirmDirPickerReset(){ var v=document.getElementById('ng-path-value'); if(v) v.textContent='使用默认目录'; var h=document.getElementById('ng-out'); if(h) h.value=''; ngDirSel=''; syncDirHighlight(); }

/* ── 筛选 tabs ── */
var currentFilter = 'all';
(function(){
  var tabs=document.querySelectorAll('.tab');
  for(var i=0;i<tabs.length;i++){
    tabs[i].addEventListener('click', function(){
      var all=document.querySelectorAll('.tab');
      for(var j=0;j<all.length;j++) all[j].classList.remove('active');
      this.classList.add('active');
      currentFilter=this.getAttribute('data-filter');
      applyFilter(currentFilter);
    });
  }
})();
function applyFilter(f){
  var cards=document.querySelectorAll('.report-card');
  for(var k=0;k<cards.length;k++){
    var show = !(f==='failed') || cards[k].getAttribute('data-status')==='failed';
    cards[k].style.display = show ? '' : 'none';
  }
}

/* ── 刷新 / 概览 ── */
async function refreshOverview(){
  try{
    var ov = await api('/overview');
    GROUPS = ov.groups || [];
    renderGroupTable(GROUPS);
    renderReportCards(GROUPS);
  }catch(e){
    var tbody=document.getElementById('group-tbody');
    if(tbody) tbody.innerHTML='<tr><td colspan="7" class="empty-row" style="color:var(--danger)">加载失败：'+esc(e&&e.message||e)+'</td></tr>';
    var rl=document.getElementById('report-list');
    if(rl) rl.innerHTML='<div class="empty-row" style="color:var(--danger)">加载失败：'+esc(e&&e.message||e)+'</div>';
  }
}

/* ── 初始化 ── */
(function init(){
  document.getElementById('today-eyebrow').textContent = todayCN();

  /* 加载系统配置，动态填充数据源名称、端点信息和连接状态 */
  api('/system/config').then(function(cfg){
    if(!cfg || !cfg.features) return;
    var ds = cfg.features.data_source || 'ciphertalk';
    var srcEl = document.getElementById('source-name');
    if(srcEl) srcEl.textContent = ds.charAt(0).toUpperCase() + ds.slice(1);

    /* 填充端点 */
    var acct = document.getElementById('source-acct');
    if(acct){
      var base = cfg.features[ds + '_base_url'] || '';
      if(base) acct.textContent = ' · ' + base.replace(/^https?:\/\//,'').replace(/\/+$/,'');
    }

    /* 探测连通性：POST /system/config/test 只探测数据源 */
    var body = {values: {data_source: ds}, targets: ['ciphertalk']};
    api('/system/config/test', {method:'POST', body: JSON.stringify(body)}).then(function(probe){
      var statusEl = document.getElementById('source-status');
      var dotEl = document.getElementById('source-dot');
      if(!statusEl || !dotEl) return;
      var result = probe && probe.ciphertalk;
      if(result === 'ok' || result === 'reachable' || result === 'connected'){
        statusEl.style.display = 'inline';
        statusEl.className = 'se-badge ok';
        statusEl.textContent = '✓ 连接正常';
        dotEl.className = 'se-dot on';
      } else if(result === 'skipped' || !result){
        /* 探测被跳过，保持默认 */
      } else {
        statusEl.style.display = 'inline';
        statusEl.className = 'se-badge err';
        statusEl.textContent = '✗ 连接失败';
        dotEl.className = 'se-dot off';
      }
    }).catch(function(e){
      /* 探测失败时显示错误状态 */
      var statusEl = document.getElementById('source-status');
      var dotEl = document.getElementById('source-dot');
      if(statusEl && dotEl){
        statusEl.style.display = 'inline';
        statusEl.className = 'se-badge err';
        statusEl.textContent = '✗ 连接失败';
        dotEl.className = 'se-dot off';
      }
    });
  }).catch(function(){ /* 静默失败，保留硬编码默认值 */ });

  refreshOverview();

  /* ── 恢复批量生成进度（查后端 active 端点，不依赖 sessionStorage）── */
  try {
    api('/runs/batch/active').then(function(list) {
      var btn = document.getElementById('btn-gen-all');
      var text = document.getElementById('gen-text');
      if (!btn) return;
      if (list && list.length) {
        // 有活跃批次 → 取最近一个，只更新按钮（点按钮展开时懒加载详情 + 重连 SSE）
        var b = list[0];
        var done = (b.completed || 0) + (b.failed || 0) + (b.skipped_empty || 0);
        var total = b.total_items || 0;
        BATCH_PANEL._activeBatch = { batchId: b.batch_id, groups: [] };
        BATCH_PANEL.batchId = b.batch_id;
        btn.classList.add('is-gen');
        btn.classList.remove('is-done');
        if (text) text.textContent = '生成中 ' + done + '/' + total;
      } else {
        // 无活跃批次 → 按钮回默认态，清掉残留 sessionStorage（以 active 为准）
        btn.classList.remove('is-gen');
        btn.classList.remove('is-done');
        if (text) text.textContent = '批量生成日报';
        try { sessionStorage.removeItem('bp_active_batch'); } catch(e) {}
      }
    }).catch(function() { /* 静默失败，保留默认按钮 */ });
  } catch(e) {}

  /* ── 恢复 ECS 同步态（查后端 progress 端点；.then 异步触发，此时 sync-panel.js 已加载）── */
  try {
    api('/sync/progress').then(function(p) {
      var btn = document.getElementById('btn-sync');
      var text = document.getElementById('sync-text');
      if (!btn || !p) return;
      if (p.state === 'syncing') {
        btn.classList.add('is-gen');
        btn.classList.remove('is-done');
        if (text) text.textContent = '同步中 ' + (p.pct || 0) + '%';
      } else {
        btn.classList.remove('is-gen', 'is-done');
        if (text) text.textContent = 'ECS 服务器同步';
      }
    }).catch(function() { /* 静默失败 */ });
  } catch(e) {}

})();
