id: world_models_extractor
name: 世界大模型动态提取器
version: 1.0.0
type: prompt

prompt: |
  从聊天记录中识别「世界大模型/世界模型」相关动态（每条动态一行）。

  【世界模型本质】给定过去和现在的观测，构建对环境的内部状态，预测未来如何演化。
  核心机制：观测 x(t)、动作 a(t) → 内部状态 s(t) → Pred 预测 s(t+1)。

  【流派分类 — 按公式/机制判定，绝不按强弱点判定】
  - 生成派（像素空间）：预测落像素空间 + 带 Dec 解码器，必须把潜状态还原成可视化画面。
    公式：x_t→Enc→s_t→Pred→s_{t+1}→Dec→x_{t+1}。代表：Sora / Veo / Genie。
  - 推理派（潜空间）：预测停在潜空间 + 无 Dec，潜状态直接驱决策/规划。
    公式：x_t→Enc→s_t→Pred→s_{t+1}→决策。代表：JEPA / Dreamer / 世界模型规划器。
  - 结构派（几何空间）：无时间序列 Pred，纯空间维度 3D 重建 + 视角外推。
    公式：{多视角+位姿}→3D重建(NeRF/3DGS)→新视角。代表：NeRF / 3D Gaussian Splatting。
  - 仿真派（物理空间）：Pred 被外部物理引擎硬替代，预测规律是写死的物理方程。
    公式：(s_t,a_t)→外部物理引擎→(x_{t+1},s_{t+1},r_{t+1})。代表：Isaac Sim / 特斯拉FSD仿真 / Waymo仿真。
  - 跨流派：世界模型概念本身（观测-动作-内部状态框架）、多流派融合机制、或带状态闭环 Agent 讨论，不归任一单一流派。

  四条判定锚点：① 预测空间（像素/潜/几何/物理）② 有无 Dec 解码器（生成派有/推理派无）③ 有无时间维度 Pred（结构派无）④ Pred 是学的还是写死（仿真派写死）。
  注意：强弱点（视觉逼真、省算力、Sim-to-Real 等）会随技术融合翻转，【只作为当下评价放进 significance 字段，绝不作为分类依据】。

  【纳入】四大流派任一的技术讨论/代表模型/进展；世界模型概念本身；流派间对比与融合；具体模型发布/评测/应用；基于世界模型的闭环 Agent；潜空间预测、Sim-to-Real 等机制细节。
  【不纳入】普通 LLM 的对话/微调（不涉及预测/状态/世界模型）；纯工具调用/插件/RAG 讨论（除非在拿它与世界模型做对比）；纯情绪/焦虑表达；与世界模型无关的泛 AI 新闻。
  判据：只有能明确归入某流派、或明确在讨论世界模型/带状态闭环的内容才抽，宁可漏抽不可滥抽。

  【字段填写】
  - school: 生成派|推理派|结构派|仿真派|跨流派（按上述机制判定）
  - model_or_system: 具体模型/系统名，无具体模型则填"通用概念"
  - topic: 一句话核心要点
  - progress: 进展/内容详述
  - signal: 突破进展|评测对比|观点质疑|趋势预测|应用案例
  - significance: 意义/影响（强弱点等当下评价放这里）
  - datetime: 时间
  - source_members: 来源成员
  - source_server_ids: 关联消息 serverId 列表（必填，用于溯源）

  无相关内容则返回空列表。school_summary 按出现的流派给出当日关键摘要。
